<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로또 그리고</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .app-nav {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        grid-column: 1 / -1;
        justify-content: center;
      }
      .nav-btn {
        padding: 10px 24px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 0.9rem;
        transition: 0.2s;
      }
      .view-section {
        display: none;
        animation: ticketReveal 520ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
      }
      .view-section.active {
        display: block;
      }
      .dashboard-container {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .chart-tab-nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .stat-card {
        padding: 16px;
        margin-bottom: 16px;
        border-radius: 8px;
        background: rgba(83, 227, 255, 0.08);
        border: 1px solid rgba(83, 227, 255, 0.15);
        color: #dcebf0;
      }
      .stat-card b { color: var(--cyan); }
      .chart-wrapper {
        background: rgba(12, 18, 28, 0.4);
        padding: 20px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
      }
      .tab-content { display: none; }
      .tab-content.active { display: block; }
      .warning-box {
        margin-top: 24px;
        padding: 16px;
        border-radius: 8px;
        background: rgba(255, 92, 168, 0.1);
        border: 1px solid rgba(255, 92, 168, 0.24);
        font-size: 0.85rem;
        color: #fdd;
      }
    </style>
  </head>
  <body>
    <canvas id="spaceCanvas" aria-hidden="true"></canvas>

    <main class="app-shell">
      <nav class="app-nav">
        <button class="nav-btn primary-action active" onclick="showView('generator')">번호 생성</button>
        <button class="nav-btn secondary-action" onclick="showView('dashboard')">데이터 분석</button>
      </nav>

      <section id="generatorView" class="view-section active generator-panel" aria-labelledby="pageTitle">
        <div class="panel-top">
          <div>
            <p class="eyebrow">Lucky Orbit</p>
            <h1 id="pageTitle">로또 그리고</h1>
          </div>
        </div>

        <div class="control-strip" aria-label="생성 옵션">
          <div style="display: flex; gap: 14px; flex-wrap: wrap; width: 100%;">
            <label class="control" style="flex: 0 1 120px;">
              <span>게임 수</span>
              <select id="setCount">
                <option value="1">1게임</option>
                <option value="3" selected>3게임</option>
                <option value="5">5게임</option>
                <option value="10">10게임</option>
              </select>
            </label>

            <label class="control" style="flex: 1 1 240px;">
              <span>고정 번호 (최대 7개)</span>
              <input id="fixedNumbers" type="text" inputmode="numeric" placeholder="예: 7, 18, 22, 38">
            </label>

            <label class="toggle" style="flex: 0 0 auto; align-self: flex-end; margin-bottom: 0;">
              <input id="includeBonus" type="checkbox" checked>
              <span>보너스 포함</span>
            </label>
          </div>
        </div>

        <div id="resultGrid" class="result-grid" aria-live="polite"></div>

        <div class="actions">
          <button id="generateBtn" class="primary-action" type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px;">
            <span><span class="icon">✦</span>번호 생성</span>
            <div style="padding-left: 12px; border-left: 1px solid rgba(7, 16, 23, 0.2); display: flex; flex-direction: column; align-items: center;">
              <span id="drawCount" style="font-size: 1.1rem; line-height: 1;">0</span>
              <small style="font-size: 0.6rem; opacity: 0.7;">TOTAL</small>
            </div>
          </button>
          <a class="secondary-action link-action" href="stories.html">이야기</a>
          <button id="copyBtn" class="secondary-action" type="button">
            복사
          </button>
          <button id="clearBtn" class="ghost-action" type="button">
            초기화
          </button>
        </div>
      </section>

      <section id="dashboardView" class="view-section generator-panel">
        <div class="dashboard-container">
          <header>
            <p class="eyebrow">Statistics</p>
            <h2>데이터 분석 대시보드</h2>
            <p style="margin-top: 8px; color: var(--muted); font-size: 0.9rem;">1회 ~ 1226회 당첨 데이터 기반</p>
          </header>

          <nav class="chart-tab-nav">
            <button class="tab-btn active primary-action" style="flex: none; min-height: 36px; font-size: 0.85rem;" onclick="showChartTab(event, 'freq')">번호 빈도</button>
            <button class="tab-btn secondary-action" style="min-height: 36px; font-size: 0.85rem;" onclick="showChartTab(event, 'range')">구간 분석</button>
            <button class="tab-btn secondary-action" style="min-height: 36px; font-size: 0.85rem;" onclick="showChartTab(event, 'oddEven')">홀짝 비율</button>
            <button class="tab-btn secondary-action" style="min-height: 36px; font-size: 0.85rem;" onclick="showChartTab(event, 'sum')">합계 분석</button>
          </nav>

          <div id="freq" class="tab-content active">
            <div class="stat-card">
              가장 많이 나온 번호: <b>14번(178회)</b>, 17번(175회)<br>
              가장 적게 나온 번호: <b>2번(152회)</b>, 1번(155회)
            </div>
            <div class="chart-wrapper">
              <canvas id="freqChart"></canvas>
            </div>
          </div>

          <div id="range" class="tab-content">
            <div class="stat-card">11~20 구간이 가장 높은 빈도로 출현했습니다.</div>
            <div class="chart-wrapper">
              <canvas id="rangeChart"></canvas>
            </div>
          </div>

          <div id="oddEven" class="tab-content">
            <div class="stat-card">홀3:짝3 균형 잡힌 조합이 약 31%를 차지합니다.</div>
            <div class="chart-wrapper" style="max-width: 400px; margin: 0 auto;">
              <canvas id="oddEvenChart"></canvas>
            </div>
          </div>

          <div id="sum" class="tab-content">
            <div class="stat-card">번호 합계 121~160 구간이 당첨 회차의 약 49%입니다.</div>
            <div class="chart-wrapper">
              <canvas id="sumChart"></canvas>
            </div>
          </div>

          <div class="warning-box">
            ⚠️ 통계는 과거의 기록일 뿐, 독립 확률인 다음 회차를 예측하지 않습니다.
          </div>
        </div>
      </section>

      <aside class="history-panel" aria-labelledby="historyTitle">
        <div class="history-header">
          <div>
            <p class="eyebrow">Archive</p>
            <h2 id="historyTitle">최근 생성 기록</h2>
          </div>
          <span id="statusText">준비됨</span>
        </div>
        <ol id="historyList" class="history-list"></ol>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
